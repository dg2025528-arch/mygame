<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>NEON BREAK</title>

<style>
:root {
    --bg: #080b14;
    --panel: #111827;
    --panel2: #182033;
    --text: #f8fafc;
    --dim: #94a3b8;
    --main: #4ce0d2;
    --sub: #ff4d8d;
    --accent: #ffc857;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(
            circle at 20% 10%,
            color-mix(in srgb, var(--main) 15%, transparent),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 80%,
            color-mix(in srgb, var(--sub) 12%, transparent),
            transparent 35%
        ),
        var(--bg);

    color: var(--text);

    font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

    user-select: none;
}

button {
    font: inherit;
}

/* =========================
   전체 화면
========================= */

.app {
    width: 100%;
    height: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

/* =========================
   화면
========================= */

.screen {
    width: 100%;
    max-width: 850px;
    height: 100%;

    display: none;
    justify-content: center;
    align-items: center;
}

.screen.active {
    display: flex;
}

/* =========================
   메인 메뉴
========================= */

.menu {
    width: min(500px, 95%);

    text-align: center;

    padding: 45px 30px;

    background: rgba(17, 24, 39, 0.92);

    border:
        1px solid
        rgba(255,255,255,0.08);

    border-radius: 25px;

    box-shadow:
        0 20px 70px rgba(0,0,0,0.45);
}

.logo {
    font-size: clamp(36px, 8vw, 70px);

    font-weight: 900;

    letter-spacing: 4px;

    margin-bottom: 10px;

    color: var(--main);

    text-shadow:
        0 0 15px var(--main),
        0 0 35px var(--main);
}

.logo span {
    color: var(--sub);

    text-shadow:
        0 0 15px var(--sub),
        0 0 35px var(--sub);
}

.subtitle {
    color: var(--dim);

    margin-bottom: 35px;

    font-size: 14px;
}

/* =========================
   메뉴 버튼
========================= */

.menu-buttons {
    display: flex;

    flex-direction: column;

    gap: 12px;
}

.menu-btn {
    width: 100%;

    padding: 17px;

    border: none;

    border-radius: 12px;

    background: var(--panel2);

    color: var(--text);

    cursor: pointer;

    font-size: 16px;

    font-weight: bold;

    transition: 0.2s;
}

.menu-btn:hover {
    transform: translateY(-2px);

    background:
        color-mix(
            in srgb,
            var(--main) 20%,
            var(--panel2)
        );

    box-shadow:
        0 5px 25px
        color-mix(
            in srgb,
            var(--main) 20%,
            transparent
        );
}

.menu-btn.primary {
    background:
        linear-gradient(
            135deg,
            var(--main),
            color-mix(
                in srgb,
                var(--main) 60%,
                var(--sub)
            )
        );

    color: #061014;
}

.best {
    margin-top: 30px;

    color: var(--dim);

    font-size: 12px;
}

.best strong {
    display: block;

    margin-top: 7px;

    color: var(--accent);

    font-size: 25px;
}

/* =========================
   테마 화면
========================= */

.panel {
    width: min(650px, 95%);

    background: rgba(17, 24, 39, 0.95);

    padding: 30px;

    border-radius: 22px;

    border:
        1px solid
        rgba(255,255,255,0.08);
}

.panel h2 {
    margin-top: 0;

    text-align: center;

    font-size: 28px;
}

.panel-description {
    text-align: center;

    color: var(--dim);

    margin-bottom: 25px;
}

.theme-grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 12px;
}

.theme {
    min-height: 120px;

    border-radius: 15px;

    border:
        2px solid
        transparent;

    padding: 15px;

    cursor: pointer;

    text-align: left;

    transition: 0.2s;

    position: relative;

    overflow: hidden;
}

.theme:hover {
    transform: translateY(-3px);
}

.theme.selected {
    border-color: white;

    box-shadow:
        0 0 25px
        rgba(255,255,255,0.2);
}

.theme-name {
    position: relative;

    z-index: 2;

    font-size: 18px;

    font-weight: bold;
}

.theme-info {
    position: relative;

    z-index: 2;

    margin-top: 8px;

    font-size: 12px;

    opacity: 0.8;
}

.theme-neon {
    background:
        linear-gradient(
            135deg,
            #081018,
            #14202b
        );

    color: #4ce0d2;
}

.theme-ocean {
    background:
        linear-gradient(
            135deg,
            #031a30,
            #064e6b
        );

    color: #38bdf8;
}

.theme-fire {
    background:
        linear-gradient(
            135deg,
            #301006,
            #7c2d12
        );

    color: #fb923c;
}

.theme-forest {
    background:
        linear-gradient(
            135deg,
            #071b12,
            #14532d
        );

    color: #4ade80;
}

.back-btn {
    width: 100%;

    margin-top: 20px;

    padding: 14px;

    background: transparent;

    color: var(--dim);

    border:
        1px solid
        rgba(255,255,255,0.1);

    border-radius: 10px;

    cursor: pointer;
}

/* =========================
   게임 화면
========================= */

.game-screen {
    flex-direction: column;

    gap: 10px;
}

.hud {
    width: 100%;

    max-width: 850px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 8px 10px;
}

.hud-title {
    font-weight: 900;

    letter-spacing: 2px;

    color: var(--main);
}

.stats {
    display: flex;

    gap: 20px;

    font-size: 13px;

    color: var(--dim);
}

.stats strong {
    color: var(--text);
}

.game-wrapper {
    position: relative;

    width: 100%;

    max-width: 850px;

    flex: 1;

    min-height: 0;

    background: var(--panel);

    border-radius: 18px;

    overflow: hidden;

    border:
        1px solid
        rgba(255,255,255,0.08);
}

canvas {
    width: 100%;
    height: 100%;

    display: block;
}

.game-overlay {
    position: absolute;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        rgba(0,0,0,0.72);

    backdrop-filter: blur(4px);

    z-index: 10;
}

.game-overlay.hidden {
    display: none;
}

.game-card {
    text-align: center;

    padding: 30px;
}

.game-card h2 {
    font-size: 30px;

    margin-bottom: 15px;
}

.game-card p {
    color: var(--dim);

    margin-bottom: 20px;
}

.game-btn {
    border: none;

    padding: 14px 25px;

    border-radius: 10px;

    background: var(--main);

    color: #061014;

    font-weight: bold;

    cursor: pointer;
}

.mobile-controls {
    display: none;

    gap: 20px;
}

.mobile-controls button {
    width: 100px;

    height: 50px;

    border: none;

    border-radius: 10px;

    background: var(--panel2);

    color: white;

    font-size: 22px;
}

/* =========================
   모바일
========================= */

@media (max-width: 600px) {

    .app {
        padding: 10px;
    }

    .theme-grid {
        grid-template-columns: 1fr 1fr;
    }

    .theme {
        min-height: 100px;
    }

    .mobile-controls {
        display: flex;
    }

    .stats {
        gap: 10px;

        font-size: 11px;
    }

    .hud-title {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- =================================
     메인 메뉴
================================= -->

<section id="menuScreen" class="screen active">

    <div class="menu">

        <div class="logo">
            NEON <span>BREAK</span>
        </div>

        <div class="subtitle">
            RETRO BRICK BREAKER
        </div>

        <div class="menu-buttons">

            <button
                class="menu-btn primary"
                id="playBtn"
            >
                🎮 게임 시작
            </button>

            <button
                class="menu-btn"
                id="themeBtn"
            >
                🎨 테마 변경
            </button>

            <button
                class="menu-btn"
                id="helpBtn"
            >
                ❓ 게임 방법
            </button>

        </div>

        <div class="best">
            BEST SCORE

            <strong id="bestScore">
                0
            </strong>
        </div>

    </div>

</section>


<!-- =================================
     테마 선택
================================= -->

<section id="themeScreen" class="screen">

    <div class="panel">

        <h2>🎨 테마 선택</h2>

        <p class="panel-description">
            게임의 분위기를 선택하세요.
        </p>

        <div class="theme-grid">

            <div
                class="theme theme-neon selected"
                data-theme="neon"
            >
                <div class="theme-name">
                    NEON
                </div>

                <div class="theme-info">
                    기본 사이버펑크
                </div>
            </div>

            <div
                class="theme theme-ocean"
                data-theme="ocean"
            >
                <div class="theme-name">
                    OCEAN
                </div>

                <div class="theme-info">
                    푸른 바다
                </div>
            </div>

            <div
                class="theme theme-fire"
                data-theme="fire"
            >
                <div class="theme-name">
                    FIRE
                </div>

                <div class="theme-info">
                    뜨거운 불꽃
                </div>
            </div>

            <div
                class="theme theme-forest"
                data-theme="forest"
            >
                <div class="theme-name">
                    FOREST
                </div>

                <div class="theme-info">
                    자연과 초록
                </div>
            </div>

        </div>

        <button
            class="back-btn"
            id="themeBack"
        >
            ← 메인 메뉴
        </button>

    </div>

</section>


<!-- =================================
     도움말
================================= -->

<section id="helpScreen" class="screen">

    <div class="panel">

        <h2>❓ 게임 방법</h2>

        <p class="panel-description">

            공을 패들로 튕겨서<br>
            모든 벽돌을 파괴하세요.

        </p>

        <div style="
            line-height:2;
            color:#cbd5e1;
            text-align:center;
        ">

            🖥️ PC<br>
            ← → 방향키 또는 마우스

            <br><br>

            📱 모바일<br>
            아래 이동 버튼

            <br><br>

            ❤️ 목숨 3개<br>
            모든 벽돌을 깨면 다음 레벨

        </div>

        <button
            class="back-btn"
            id="helpBack"
        >
            ← 메인 메뉴
        </button>

    </div>

</section>


<!-- =================================
     게임
================================= -->

<section
    id="gameScreen"
    class="screen game-screen"
>

    <div class="hud">

        <div class="hud-title">
            NEON BREAK
        </div>

        <div class="stats">

            <span>
                LEVEL
                <strong id="level">
                    1
                </strong>
            </span>

            <span>
                SCORE
                <strong id="score">
                    0
                </strong>
            </span>

            <span>
                ❤️
                <strong id="lives">
                    3
                </strong>
            </span>

        </div>

    </div>


    <div class="game-wrapper">

        <canvas id="canvas"></canvas>

        <div
            id="gameOverlay"
            class="game-overlay hidden"
        >

            <div class="game-card">

                <h2 id="overlayTitle">
                    GAME OVER
                </h2>

                <p id="overlayText">
                    게임이 끝났습니다.
                </p>

                <button
                    class="game-btn"
                    id="overlayButton"
                >
                    다시 하기
                </button>

                <br><br>

                <button
                    class="back-btn"
                    id="gameMenuBtn"
                >
                    메인 메뉴
                </button>

            </div>

        </div>

    </div>


    <div class="mobile-controls">

        <button id="leftBtn">
            ◀
        </button>

        <button id="rightBtn">
            ▶
        </button>

    </div>

</section>

</div>


<script>

/* =====================================
   테마 시스템
===================================== */

const themes = {

    neon: {
        bg: "#080b14",
        panel: "#111827",
        main: "#4ce0d2",
        sub: "#ff4d8d",
        accent: "#ffc857"
    },

    ocean: {
        bg: "#031421",
        panel: "#06243a",
        main: "#38bdf8",
        sub: "#818cf8",
        accent: "#67e8f9"
    },

    fire: {
        bg: "#1c0803",
        panel: "#301006",
        main: "#fb923c",
        sub: "#ef4444",
        accent: "#facc15"
    },

    forest: {
        bg: "#04120a",
        panel: "#0b2416",
        main: "#4ade80",
        sub: "#22c55e",
        accent: "#bef264"
    }

};


let currentTheme =
    localStorage.getItem("brickTheme")
    || "neon";


function applyTheme(name) {

    const theme =
        themes[name];

    if (!theme) return;

    document.documentElement.style.setProperty(
        "--bg",
        theme.bg
    );

    document.documentElement.style.setProperty(
        "--panel",
        theme.panel
    );

    document.documentElement.style.setProperty(
        "--main",
        theme.main
    );

    document.documentElement.style.setProperty(
        "--sub",
        theme.sub
    );

    document.documentElement.style.setProperty(
        "--accent",
        theme.accent
    );

    currentTheme = name;

    localStorage.setItem(
        "brickTheme",
        name
    );

    document
        .querySelectorAll(".theme")
        .forEach(card => {

            card.classList.toggle(
                "selected",
                card.dataset.theme === name
            );

        });
}


applyTheme(currentTheme);


/* =====================================
   화면 전환
===================================== */

const screens = {

    menu:
        document.getElementById(
            "menuScreen"
        ),

    theme:
        document.getElementById(
            "themeScreen"
        ),

    help:
        document.getElementById(
            "helpScreen"
        ),

    game:
        document.getElementById(
            "gameScreen"
        )

};


function showScreen(name) {

    Object.values(screens)
        .forEach(screen => {

            screen.classList.remove(
                "active"
            );

        });

    screens[name]
        .classList.add("active");

    if (name === "game") {

        resizeCanvas();

        draw();

    }

}


/* =====================================
   메뉴
===================================== */

document
    .getElementById("playBtn")
    .onclick = () => {

        showScreen("game");

        startGame();

    };


document
    .getElementById("themeBtn")
    .onclick = () => {

        showScreen("theme");

    };


document
    .getElementById("helpBtn")
    .onclick = () => {

        showScreen("help");

    };


document
    .getElementById("themeBack")
    .onclick = () => {

        showScreen("menu");

    };


document
    .getElementById("helpBack")
    .onclick = () => {

        showScreen("menu");

    };


/* =====================================
   테마 클릭
===================================== */

document
    .querySelectorAll(".theme")
    .forEach(card => {

        card.addEventListener(
            "click",
            () => {

                applyTheme(
                    card.dataset.theme
                );

            }
        );

    });


/* =====================================
   게임 변수
===================================== */

const canvas =
    document.getElementById(
        "canvas"
    );

const ctx =
    canvas.getContext("2d");


let width;
let height;

let running = false;

let score = 0;

let lives = 3;

let level = 1;

let animation;


let paddle = {

    width: 110,

    height: 14,

    x: 0,

    y: 0,

    speed: 8

};


let ball = {

    x: 0,

    y: 0,

    radius: 7,

    dx: 4,

    dy: -4

};


let bricks = [];


/* =====================================
   크기 조절
===================================== */

function resizeCanvas() {

    const rect =
        canvas
            .parentElement
            .getBoundingClientRect();


    width =
        rect.width;

    height =
        rect.height;


    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;


    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    paddle.y =
        height - 35;


    if (paddle.x === 0) {

        paddle.x =
            width / 2 -
            paddle.width / 2;

    }

}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================
   벽돌 생성
===================================== */

function createBricks() {

    bricks = [];


    const rows =
        Math.min(
            4 + level,
            8
        );


    const columns =
        width < 500
            ? 7
            : 10;


    const gap = 7;

    const side = 10;

    const brickWidth =
        (
            width -
            side * 2 -
            gap * (columns - 1)
        ) / columns;


    const brickHeight = 22;


    for (
        let row = 0;
        row < rows;
        row++
    ) {

        for (
            let col = 0;
            col < columns;
            col++
        ) {

            bricks.push({

                x:
                    side +
                    col *
                    (brickWidth + gap),

                y:
                    25 +
                    row *
                    (brickHeight + gap),

                width:
                    brickWidth,

                height:
                    brickHeight,

                alive:
                    true

            });

        }

    }

}


/* =====================================
   게임 시작
===================================== */

function startGame() {

    cancelAnimationFrame(
        animation
    );


    score = 0;

    lives = 3;

    level = 1;


    paddle.x =
        width / 2 -
        paddle.width / 2;


    ball.x =
        width / 2;


    ball.y =
        height - 60;


    ball.dx =
        4 *
        (Math.random() > 0.5
            ? 1
            : -1);


    ball.dy = -4;


    createBricks();

    updateHud();


    running = true;


    gameLoop();

}


/* =====================================
   HUD
===================================== */

function updateHud() {

    document.getElementById(
        "score"
    ).textContent = score;


    document.getElementById(
        "lives"
    ).textContent = lives;


    document.getElementById(
        "level"
    ).textContent = level;


    document.getElementById(
        "bestScore"
    ).textContent =
        localStorage.getItem(
            "brickBest"
        ) || 0;

}


/* =====================================
   그리기
===================================== */

function draw() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /* 배경 */

    ctx.fillStyle =
        getComputedStyle(
            document.documentElement
        ).getPropertyValue(
            "--panel"
        );


    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* 벽돌 */

    bricks.forEach(
        brick => {

            if (!brick.alive)
                return;


            ctx.fillStyle =
                getComputedStyle(
                    document.documentElement
                ).getPropertyValue(
                    "--main"
                );


            ctx.shadowColor =
                ctx.fillStyle;

            ctx.shadowBlur = 8;


            ctx.beginPath();

            ctx.roundRect(
                brick.x,
                brick.y,
                brick.width,
                brick.height,
                5
            );

            ctx.fill();


            ctx.shadowBlur = 0;

        }
    );


    /* 공 */

    ctx.fillStyle =
        getComputedStyle(
            document.documentElement
        ).getPropertyValue(
            "--accent"
        );


    ctx.shadowColor =
        ctx.fillStyle;

    ctx.shadowBlur = 15;


    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.shadowBlur = 0;


    /* 패들 */

    const gradient =
        ctx.createLinearGradient(
            paddle.x,
            0,
            paddle.x +
            paddle.width,
            0
        );


    gradient.addColorStop(
        0,
        getComputedStyle(
            document.documentElement
        ).getPropertyValue(
            "--main"
        )
    );


    gradient.addColorStop(
        1,
        getComputedStyle(
            document.documentElement
        ).getPropertyValue(
            "--sub"
        )
    );


    ctx.fillStyle =
        gradient;


    ctx.beginPath();

    ctx.roundRect(
        paddle.x,
        paddle.y,
        paddle.width,
        paddle.height,
        7
    );

    ctx.fill();

}


/* =====================================
   충돌
===================================== */

function collision() {

    bricks.forEach(
        brick => {

            if (!brick.alive)
                return;


            if (
                ball.x >
                brick.x &&
                ball.x <
                brick.x +
                brick.width &&
                ball.y >
                brick.y &&
                ball.y <
                brick.y +
                brick.height
            ) {

                ball.dy *= -1;

                brick.alive = false;

                score += 10;

                updateHud();

            }

        }
    );

}


/* =====================================
   게임 업데이트
===================================== */

function update() {

    ball.x += ball.dx;

    ball.y += ball.dy;


    /* 좌우 벽 */

    if (
        ball.x -
        ball.radius < 0 ||

        ball.x +
        ball.radius > width
    ) {

        ball.dx *= -1;

    }


    /* 위쪽 */

    if (
        ball.y -
        ball.radius < 0
    ) {

        ball.dy *= -1;

    }


    /* 패들 */

    if (

        ball.y +
        ball.radius >=
        paddle.y &&

        ball.y <
        paddle.y +
        paddle.height &&

        ball.x >=
        paddle.x &&

        ball.x <=
        paddle.x +
        paddle.width &&

        ball.dy > 0

    ) {

        ball.dy *= -1;


        const hit =
            (
                ball.x -
                (
                    paddle.x +
                    paddle.width / 2
                )
            ) /
            (
                paddle.width / 2
            );


        ball.dx =
            hit * 6;

    }


    collision();


    /* 공이 떨어짐 */

    if (
        ball.y -
        ball.radius >
        height
    ) {

        lives--;

        updateHud();


        if (lives <= 0) {

            gameOver();

        }

        else {

            ball.x =
                width / 2;

            ball.y =
                height - 60;

            ball.dx =
                4 *
                (
                    Math.random() > 0.5
                        ? 1
                        : -1
                );

            ball.dy = -4;

        }

    }


    /* 클리어 */

    if (
        bricks.every(
            brick =>
                !brick.alive
        )
    ) {

        nextLevel();

    }

}


/* =====================================
   게임 루프
===================================== */

function gameLoop() {

    if (!running)
        return;


    update();

    draw();


    animation =
        requestAnimationFrame(
            gameLoop
        );

}


/* =====================================
   게임 오버
===================================== */

function gameOver() {

    running = false;


    const oldBest =
        Number(
            localStorage.getItem(
                "brickBest"
            ) || 0
        );


    if (score > oldBest) {

        localStorage.setItem(
            "brickBest",
            score
        );

    }


    updateHud();


    showGameOverlay(
        "GAME OVER",
        `점수: ${score}`,
        "다시 하기"
    );

}


/* =====================================
   다음 레벨
===================================== */

function nextLevel() {

    running = false;


    level++;


    showGameOverlay(
        `LEVEL ${level - 1} CLEAR!`,
        `현재 점수: ${score}`,
        "다음 레벨"
    );

}


/* =====================================
   게임 오버레이
===================================== */

const gameOverlay =
    document.getElementById(
        "gameOverlay"
    );


const overlayTitle =
    document.getElementById(
        "overlayTitle"
    );


const overlayText =
    document.getElementById(
        "overlayText"
    );


const overlayButton =
    document.getElementById(
        "overlayButton"
    );


function showGameOverlay(
    title,
    text,
    button
) {

    overlayTitle.textContent =
        title;

    overlayText.textContent =
        text;

    overlayButton.textContent =
        button;

    gameOverlay.classList.remove(
        "hidden"
    );

}


overlayButton.onclick =
    () => {

        gameOverlay.classList.add(
            "hidden"
        );


        if (
            overlayButton.textContent ===
            "다음 레벨"
        ) {

            paddle.x =
                width / 2 -
                paddle.width / 2;


            ball.x =
                width / 2;


            ball.y =
                height - 60;


            ball.dx =
                4 *
                (
                    Math.random() > 0.5
                        ? 1
                        : -1
                );


            ball.dy = -4;


            createBricks();


            updateHud();


            running = true;

            gameLoop();

        }

        else {

            startGame();

        }

    };


/* =====================================
   메인 메뉴
===================================== */

document
    .getElementById(
        "gameMenuBtn"
    )
    .onclick = () => {

        running = false;

        gameOverlay.classList.add(
            "hidden"
        );

        showScreen("menu");

        updateHud();

    };


/* =====================================
   키보드
===================================== */

let left = false;

let right = false;


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "ArrowLeft"
        ) {

            left = true;

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            right = true;

        }

    }
);


document.addEventListener(
    "keyup",
    event => {

        if (
            event.key ===
            "ArrowLeft"
        ) {

            left = false;

        }


        if (
            event.key ===
            "ArrowRight"
        ) {

            right = false;

        }

    }
);


/* =====================================
   마우스
===================================== */

canvas.addEventListener(
    "mousemove",
    event => {

        const rect =
            canvas.getBoundingClientRect();


        paddle.x =
            event.clientX -
            rect.left -
            paddle.width / 2;

    }
);


/* =====================================
   모바일
===================================== */

const leftBtn =
    document.getElementById(
        "leftBtn"
    );


const rightBtn =
    document.getElementById(
        "rightBtn"
    );


leftBtn.addEventListener(
    "touchstart",
    () => {
        left = true;
    }
);


leftBtn.addEventListener(
    "touchend",
    () => {
        left = false;
    }
);


rightBtn.addEventListener(
    "touchstart",
    () => {
        right = true;
    }
);


rightBtn.addEventListener(
    "touchend",
    () => {
        right = false;
    }
);


/* 키보드 이동 */

setInterval(
    () => {

        if (!running)
            return;


        if (left)
            paddle.x -= paddle.speed;


        if (right)
            paddle.x += paddle.speed;


        paddle.x =
            Math.max(
                0,
                Math.min(
                    width -
                    paddle.width,
                    paddle.x
                )
            );

    },
    16
);


/* =====================================
   초기화
===================================== */

resizeCanvas();

updateHud();

</script>
